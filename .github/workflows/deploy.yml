name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: acrprojectapp.azurecr.io
  APP_NAME: web-app-project
  RESOURCE_GROUP: rg-project-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test   # real tests — this actually fails the job if something's broken

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - run: zip -r release.zip . -x ".git/*" ".github/*"

      - name: Deploy to STAGING slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: staging                      # fixed: was "production"
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip

      - name: Health check staging
        run: |
          sleep 30
          curl -f https://${{ env.APP_NAME }}-staging.azurewebsites.net/health || exit 1

  swap-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure CLI login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}   # fixed: needs a service-principal JSON, not the publish profile

      - name: Swap staging -> production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --slot staging \
              --target-slot production
