name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

# Global environment variables accessible by EVERY job below
env:
  ACR_NAME: acrprojectapp.azurecr.io
  APP_NAME: web-app-project
  RESOURCE_GROUP: rg-project-app
  STAGING_URL: "web-app-project-staging-c9g7g5fpbab3erfy.centralus-01.azurewebsites.net"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Tests
        run: echo "Running automated tests..."

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}/app:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}/app:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: staging
          images: '${{ env.ACR_NAME }}/app:${{ github.sha }}'

      - name: Health Check
        run: |
          echo "Waiting for container startup and DNS routing..."
          sleep 90
          curl -f --retry 5 --retry-delay 15 --retry-connrefused https://${{ env.STAGING_URL }}/health || exit 1

  swap-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap Staging to Production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging --target-slot production

