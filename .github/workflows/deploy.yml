name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  APP_NAME: web-app-project
  RESOURCE_GROUP: rg-project-app
  STAGING_URL: "web-app-project-staging-c9g7g5fpbab3erfy.centralus-01.azurewebsites.net"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - run: zip -r release.zip . -x ".git/*" ".github/*" "tests/*"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to STAGING slot
        run: |
          az webapp deploy --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} --slot staging \
            --src-path release.zip --type zip

      - name: Health check staging
        run: |
          for i in $(seq 1 10); do
            curl -sf https://${{ env.STAGING_URL }}/health && exit 0
            echo "Not ready yet, waiting..."
            sleep 10
          done
          echo "Staging never became healthy"
          exit 1

  swap-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap staging -> production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --slot staging \
              --target-slot production
